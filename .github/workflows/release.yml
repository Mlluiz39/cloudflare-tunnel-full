name: Release

# Gera os instaladores quando você publica uma tag (ex.: v3.2.1).
# Também pode ser rodado manualmente (Actions → Release → Run workflow):
# nesse caso apenas compila e guarda os artefatos do run, sem criar Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (AppImage portátil + pacote .deb)
          - os: ubuntu-latest
            label: linux-x64
            args: --linux
          # macOS: compila x64 (Intel) e arm64 (Apple Silicon) no mesmo runner.
          # Funciona sem runner Intel porque o projeto não tem dependências
          # nativas (só js-yaml, em JS puro).
          - os: macos-latest
            label: macos-x64-arm64
            args: --mac --x64 --arm64
          # Windows x64 (instalador NSIS)
          - os: windows-latest
            label: windows-x64
            args: --win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não depende de cloudflared instalado (os testes de integração
      # completos rodam na máquina do desenvolvedor).
      - name: Checar sintaxe
        run: node scripts/lint.js

      - name: Gerar instaladores
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Sem certificado de assinatura: gera builds não assinados.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Guardar instaladores do run
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  # Job separado para publicar: evita que vários jobs escrevam na mesma
  # Release ao mesmo tempo (o que duplicaria chamadas de API e poderia
  # sobrescrever as notas geradas automaticamente).
  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # Histórico completo + tags: as notas saem do `git log` entre a tag
      # anterior e a atual.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar todos os instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Listar arquivos
        run: ls -lh dist

      # O GitHub só monta "What's Changed" a partir de pull requests. Como aqui
      # se commita direto na main, as notas são geradas dos commits da tag.
      - name: Montar notas da release
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            HEADING="Mudanças desde ${PREV}"
          else
            RANGE="${TAG}"
            HEADING="Primeira release"
          fi

          {
            echo "## ${HEADING}"
            echo
            git log --no-merges --pretty=format:'- %s (`%h`)' "$RANGE"
            echo
            echo
            if [ -n "$PREV" ]; then
              echo "**Changelog completo**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              echo
            fi
            echo "---"
            echo
            echo "| Sistema | Arquitetura |"
            echo "| --- | --- |"
            echo "| Linux (AppImage / deb) | x64 (amd64) |"
            echo "| macOS (dmg) | Intel (x64) e Apple Silicon (arm64) |"
            echo "| Windows (exe) | x64 |"
            echo
            echo "> Requer o \`cloudflared\`, que o próprio app instala em **Configurações → Instalar/atualizar**."
          } > notes.md

          echo "----- notas geradas -----"
          cat notes.md

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: false
