name: Release

# Gera os instaladores de cada sistema quando você publica uma tag (ex.: v3.2.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não depende de cloudflared instalado (os testes de integração
      # completos rodam na máquina do desenvolvedor).
      - name: Checar sintaxe
        run: node scripts/lint.js

      - name: Gerar instaladores
        run: npx electron-builder --publish never
        env:
          # Impede o electron-builder de tentar assinar no macOS/Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          fail_on_unmatched_files: false
